name: shop

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 15s

x-logging: &logging-defaults
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  proxy:
    image: traefik:v3.6.16
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --ping=true
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping=true"]
    restart: unless-stopped
    logging: *logging-defaults

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
    restart: unless-stopped
    logging: *logging-defaults

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped
    logging: *logging-defaults

  api:
    image: shopapi:tp04
    build:
      context: ./apps/shopapi
      args:
        APP_VERSION: "1.4.3"
        GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    secrets:
      - db_password
    command:
      - sh
      - -ec
      - |
        db_password="$$(cat /run/secrets/db_password)"
        export DATABASE_URL="postgresql://shop:$${db_password}@db:5432/shop"
        exec node src/server.js
    networks:
      - front
      - back
    labels:
      traefik.enable: "true"
      traefik.docker.network: shop_front
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.service: api
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /ready
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    restart: unless-stopped
    logging: *logging-defaults

  worker:
    image: shop-worker:tp04
    build:
      context: ./apps/shop-worker
      secrets:
        - pipconf
      args:
        APP_VERSION: "1.4.3"
        GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
    secrets:
      - db_password
    command:
      - sh
      - -ec
      - |
        db_password="$$(cat /run/secrets/db_password)"
        export DATABASE_URL="postgresql://shop:$${db_password}@db:5432/shop"
        exec python -m worker.main
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics',timeout=2).read(1)"]
    restart: unless-stopped
    logging: *logging-defaults

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front
      - back
    labels:
      traefik.enable: "true"
      traefik.docker.network: shop_front
      traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
      traefik.http.routers.adminer.entrypoints: web
      traefik.http.services.adminer.loadbalancer.server.port: "8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    restart: "no"
    logging: *logging-defaults

  migrate:
    image: postgres:16.4-alpine
    profiles: [ops]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION: ${MIGRATION:-}
    secrets:
      - db_password
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - back
    entrypoint: ["sh", "-ec"]
    command:
      - |
        case "$$MIGRATION" in
          ''|*[!a-zA-Z0-9._-]*) echo 'Nom de migration invalide' >&2; exit 2 ;;
        esac
        test -f "/migrations/$$MIGRATION" || { echo 'Migration absente' >&2; exit 2; }
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        exec psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$$MIGRATION"
    restart: "no"
    logging: *logging-defaults

networks:
  front: {}
  back:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ./secrets/pip.conf
