name: exo5

services:
  mysql:
    image: mysql:8.4
    container_name: exo5-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: exo5-root-2026
      MYSQL_DATABASE: ecole
      MYSQL_USER: etudiant
      MYSQL_PASSWORD: exo5-etudiant-2026
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - exo5-reseau
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: exo5-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: exo5-mysql
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - exo5-reseau
    depends_on:
      mysql:
        condition: service_healthy

networks:
  exo5-reseau:
    name: exo5-reseau

volumes:
  mysql-data:
    name: exo5-mysql-data
