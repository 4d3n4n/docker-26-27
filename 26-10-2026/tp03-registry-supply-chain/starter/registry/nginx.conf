events {
  worker_connections 1024;
}

http {
  map $http_origin $cors_origin {
    default "";
    ~^http://(localhost|127\.0\.0\.1):8081$ $http_origin;
  }

  server {
    listen 443 ssl;
    server_name registry.local localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Authorization,Accept,Cache-Control,Content-Type" always;
    add_header Access-Control-Allow-Methods "GET,HEAD,OPTIONS,POST,PUT,PATCH,DELETE" always;
    add_header Access-Control-Expose-Headers "Docker-Content-Digest,Location" always;

    location = /healthz {
      auth_basic off;
      return 200 "ok\n";
    }

    location /v2/ {
      if ($request_method = OPTIONS) {
        return 204;
      }

      auth_basic "Shop SAS Registry";
      auth_basic_user_file /etc/nginx/auth/users.htpasswd;
      limit_except GET HEAD OPTIONS {
        auth_basic "Shop SAS Registry Push";
        auth_basic_user_file /etc/nginx/auth/ci.htpasswd;
      }

      proxy_pass http://registry:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 900s;
    }

    location / {
      return 404;
    }
  }
}
